# Secret scanning — blocks any push or PR that introduces a NEW credential.
# Part of the security-routine kit (see docs/SECURITY_ROUTINE.md).
#
# How this works:
#   - .gitleaks.toml = gitleaks v8.24.3 default ruleset (208 rules) + project
#     allowlists. Regenerate via scripts/merge-gitleaks.py when upgrading.
#     (A custom config with no [[rules]] silently scans with ZERO rules —
#     the exact failure mode caught while setting this up.)
#   - .gitleaks-baseline.json = documented, redacted legacy findings. Only
#     new findings in the pushed branch/PR range fail the build.
#   - gitleaks is pinned to v8.24.3 to match the embedded default ruleset.
#
# ⚠ ROTATION DEBT: the baseline includes one real POSTGRES_PASSWORD committed
# to history at 8c433880 (notes/Admin Users.md). The file was scrubbed from
# HEAD long ago, but the value remains in git history. ROTATE the VM's
# postgres password, then this entry is moot. Do NOT delete the baseline
# entry instead of rotating.

name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scanner must see every commit in the push.
          fetch-depth: 0

      - name: Install gitleaks (pinned v8.24.3)
        run: |
          curl -sfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan commits introduced by this push or PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/$EVENT_BASE_REF"
          elif [[ ! "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
            base_ref="$EVENT_BEFORE"
          elif [[ "$EVENT_REF_NAME" != "main" ]]; then
            base_ref="origin/main"
          else
            base_ref="$(git rev-parse "$EVENT_SHA^")"
          fi

          if ! git merge-base --is-ancestor "$base_ref" "$EVENT_SHA"; then
            echo "::error::Cannot establish the pushed branch range for Gitleaks."
            exit 1
          fi

          ./gitleaks git --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --log-opts="$base_ref..$EVENT_SHA" --redact
