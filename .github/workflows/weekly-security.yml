name: Weekly Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency & Invariant Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed runtime high/critical & build critical dependency audit
        run: node scripts/dependency-audit.mjs
      - name: Security, migration immutability & bug invariant gate
        run: node scripts/security-and-bug-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: test-results/dependency-security/*-audit.json
          retention-days: 30
