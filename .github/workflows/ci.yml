# ──────────────────────────────────────────────────────────────────────────────
# METARDU CI Pipeline
#
# Triggers on push / PR to main.
# Jobs: typecheck → lint → build → test → security audit → i18n integrity → E2E → axe sweep.
# Build is now gated in CI so regressions like styled-jsx in Server
# Components are caught BEFORE they reach the VM deploy.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    # Two full eslint passes run here (a11y-audit + warning-ratchet) on top of
    # the changed-files gate — 15 min gives both comfortable headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need base branch for diff-based ratchet
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # AUDIT FIX (2026-07-05): Reworked the lint gate.
      #
      # Previous state: --max-warnings 1300 with continue-on-error: true
      # → effectively a no-op gate. New warnings were never caught.
      #
      # AUDIT FIX (2026-08-03): Replaced --max-warnings 0 on changed files
      # with the lint-gate.mjs ratchet. --max-warnings 0 failed on any file
      # carrying PRE-EXISTING warnings (legacy @typescript-eslint/no-unsafe-*
      # etc.), so the gate could never pass on real PRs touching dirty files.
      # The changed-files gate is a true "no new warnings" ratchet: it lints
      # the files changed vs the resolved base ref at that ref and at HEAD,
      # and fails ONLY when HEAD adds warnings — fast (changed files only).
      # The base ref is resolved inside the script (PR → origin/<base>, push
      # → event.before, fallback HEAD~1) and the per-family floors are
      # auto-loaded from the committed baselines — a single flag call, no
      # inline bash.
      # GUARDRAIL (2026-08-11): --max-warnings N is an absolute ceiling on the
      # changed-files lint total (limit = max(base, N)) - a backstop so a mega
      # diff cannot slip thousands of warnings past the no-new-warnings ratchet.
      # Tightened 20,000 -> ... -> 700 -> 550 -> 500 -> 350 -> 0. Final
      # state reached 2026-08-13: whole-repo count is ZERO warnings (batch 11
      # drained the 1-warning no-unused-vars tail, 261 sites; rule flipped to
      # error). --max-warnings 0 now means any warning on any changed file
      # fails the gate (per plan §6 step 3).
      - name: Lint changed files (blocking, zero new warnings)
        run: node scripts/lint-gate.mjs --paths-from-changed --max-warnings 0
      # A11Y GATE (2026-08-03): Bans placeholder-like / junk aria-labels
      # codebase-wide (placeholder-equals-name, generic phrases, punctuation,
      # crunched header text) so accessible names can't regress in tables.
      # Pure-node regex scan over src/ — fast, no deps, blocks CI on any hit.
      - name: Aria-label gate (blocking, bans junk accessible names)
        run: node scripts/aria-label-gate.mjs
      # Per-rule ratchets (warning-baseline.json + a11y-baseline.json) in ONE
      # eslint pass — blocks on ANY rule exceeding its baseline. A rule absent
      # from a baseline counts as 0, so brand-new violations fail CI.
      #
      # --report prints per-rule drift tables (committed-at-HEAD vs baseline vs
      # live count, Δ since last commit) to the Actions log on every push, so
      # per-family lint movement is visible without a manual run.
      - name: Whole-repo lint ratchets (blocking, prints drift tables)
        run: node scripts/lint-ratchets.mjs --write-audit --report
      # SUPPRESSION GATE (2026-08-12): blocks the "fake green" attack where
      # warnings are silenced with // eslint-disable comments instead of real
      # fixes (this once dropped the warning count 1,646 -> 119 while adding
      # 1,600+ disables across 560 files — every lint gate read "green" while
      # code quality regressed). Pure-node token scan, hard-capped floor in
      # scripts/suppression-baseline.json; --check lists the offending files
      # and per-file delta vs the last commit so CI is self-diagnosing.
      - name: Suppression gate (blocking, caps eslint-disable comments)
        run: node scripts/suppression-gate.mjs --check

  lint-ratchet-fast:
    # RATCHET_FAIL_FAST (2026-08-13): whole-repo per-rule ratchet as its own
    # early job so a drift (live count > committed baseline — the e8d9b317
    # case) fails the commit's OWN run at the earliest point. ci.yml cancels
    # in-flight runs on rapid pushes (cancel-in-progress), which could
    # otherwise supersede the ESLint job before it reaches the ratchet step
    # and push the failure to the next run. ~2 min (checkout + npm ci + one
    # eslint pass), parallel to the other early jobs. The same ratchet still
    # runs inside the ESLint job (with --write-audit); this job is the
    # earliest, independent verdict.
    name: Lint Ratchet (fail-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Whole-repo lint ratchets (blocking, per-rule baselines)
        run: node scripts/lint-ratchets.mjs --report

  row-typing:
    name: API Row-Typing Gate
    # ROW-TYPING GATE (2026-08-07): dedicated job for api-row-sweep --check so
    # the gate runs on EVERY PR/push, independent of the (slower) ESLint job.
    # Blocks any PR/push that touches a route.ts containing an untyped
    # db.query/client.query, plus the whole-repo shared-schema drift check.
    # Pure git-diff + static scan — zero npm dependencies (no npm ci), so it
    # stays seconds-fast even as an isolated job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # base ref (origin/<base> on PRs, event.before on pushes) must exist locally
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: API row-typing gate (blocking, no untyped queries in touched routes)
        run: node scripts/api-row-sweep.mjs --check --paths-from-changed

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Block PRs that fail to build — this is the gate that catches
    # Server Component / styled-jsx / RSC violations before deploy.
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Build Next.js (production)
        env:
          # Skip Sentry + GCS upload during CI build — they're not needed
          # to validate compilation and would otherwise fail without secrets.
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: npx next build
      - name: Verify standalone output exists
        run: |
          test -d .next/standalone && echo "✓ standalone build OK"
          test -f .next/BUILD_ID && echo "✓ BUILD_ID present"
      # Upload the compiled .next dir so E2E shards can start without rebuilding.
      # E2E_BUILD_ARTIFACT (2026-08-08): removes the hidden ~8-min rebuild that
      # was pushing the e2e job past its 20-min timeout on every push.
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            public/
          # .next/ is a dot-directory — upload-artifact@v4 excludes hidden
          # files by default and would silently drop the whole build.
          include-hidden-files: true
          # Keep for 1 day — only needed for the E2E shards in the same run.
          retention-days: 1

  i18n:
    name: i18n Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Verify all locale files parse and cover English keys
        run: node scripts/i18n-sync.mjs --check

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # AUDIT FIX (2026-07-05): Was `npx jest --silent --passWithNoTests`
      # without `--coverage` — meaning the coverageThreshold config in
      # jest.config.js (branches:55, functions:80, lines:80, statements:80)
      # was never enforced. Tests passing ≠ code covered.
      #
      # Now: run with --coverage --coverageReporters=text-summary so the
      # thresholds gate the CI. If coverage drops below the configured
      # thresholds, this job fails.
      #
      # P2-7 (2026-07-24): Removed --passWithNoTests. METARDU has 132+ test
      # suites — if Jest finds zero tests, that's a configuration error
      # that should fail the build, not silently pass.
      - run: npx jest --silent --coverage --coverageReporters=text-summary

  e2e:
    name: "E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis (not plain postgres): migration 000_canonical_schema.sql
        # requires the PostGIS extension — the plain image made `npm run migrate`
        # fail at step 1. Matches the repo's docker-compose image/version.
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: metardu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # E2E_SHARDING (2026-08-12): 4 balanced file-group shards (deterministic
    # spec lists, not Playwright's --shard — its sorted-test chunking splits
    # this suite 102/55/86/39). Profile re-measured 2026-08-12 on the dev
    # server (run 31634155135, list reporter; per-shard summaries authoritative):
    #   navigation-pages 47 (~145s) — the elephant: 46 routes cold-
    #   compiled on first hit, so it gets its own shard. (NAV_MOBILE_SKIP
    #   2026-08-13: mobile project dropped for this spec — viewport-agnostic
    #   404/SEO checks; responsive coverage lives in responsive-a11y.spec.ts.)
    #   project-crud 36 (~133s) · auth-flow 31 (~90s) · login 24 (~82s) ·
    #   landing 24 (~86s) · fieldbook 20 (~59s) · responsive-a11y 22 (~47s) ·
    #   security-perf 20 (~41s). (fieldbook trimmed 30 -> 20 during the
    #   E2E-fix session, so G3 is 51 tests, not 62.)
    # Groups balance wall time by measured per-test rates:
    #   G1 navigation-pages (47) · G2 project-crud+login (60) ·
    #   G3 auth-flow+fieldbook (51) · G4 landing+responsive-a11y+security-perf (66).
    # A 2-way split ran ~35 min per shard and was cancelled at the job limit;
    # each group is ~1/2 that load and finishes inside the timeout.
    #   1. Runs the dev server (npx next dev -p 3099) — the standalone server
    #      silently drops the edge middleware (auth redirects, CSP, rate limits)
    #      and crashes in the sandbox when middleware is compiled into it.
    #   2. Postgres service container is available for health checks and any
    #      API calls that need the database.
    #   3. Executes its assigned spec group.
    # E2E_FAST (2026-08-12): measured shard wall time on the green 4-group
    # split is 4.4-6.8 min across runs 31627937210/31632150721/31634155135
    # (nav-pages shard 1 worst 6.8 min — under the 8-min balance bar, so no
    # rebalance needed; G2 5.2-5.7 · G3 4.4-4.7 · G4 4.6-4.9). After the
    # mobile skip for navigation-pages (2026-08-13) G1 re-measured ~4.5 min.
    # Retries
    # lowered to 1 in playwright.config.ts. The
    # 20-min cap is 3x the measured time — cancels fast on a regression
    # instead of churning toward the old 30-min wall.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - shard: 1
            specs: 'e2e/navigation-pages.spec.ts'
            # NAV_WORKERS (2026-08-13): the 47 route loads are lazy
            # dev-server cold compiles; measured 8-way concurrent
            # compiles finish in ~36% of serial (17.4s -> 6.3s for 8
            # routes). With workers:1 the tests ran serially, so the
            # compiles never overlapped. 8 workers spread the parallel
            # describes in navigation-pages.spec.ts and let the dev
            # compiler pipeline them. Other shards stay at 1 (their
            # tests are DB/flow-heavy, not compile-heavy).
            workers: 8
          - shard: 2
            specs: 'e2e/project-crud.spec.ts e2e/login.spec.ts'
            workers: 1
          - shard: 3
            specs: 'e2e/auth-flow.spec.ts e2e/fieldbook.spec.ts'
            workers: 1
          - shard: 4
            specs: 'e2e/landing.spec.ts e2e/responsive-a11y.spec.ts e2e/security-perf.spec.ts'
            workers: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # E2E_DB_SCHEMA (2026-08-12): the Postgres service container starts
      # EMPTY. DB-backed specs (project-crud dashboard load, auth register)
      # hit undefined-table errors, and a hanging query wedges the dev server
      # with no output for ~26 min — shard 2/4 was cancelled this way on the
      # 4-group split. Apply the schema before tests (idempotent via
      # schema_migrations; each shard runner has its own Postgres container).
      # The migration chain grants RLS policies TO authenticated — a role
      # plain Postgres lacks (044 fails: role "authenticated" does not exist).
      - name: Create Supabase-style roles
        run: node scripts/ensure-supabase-roles.mjs
        env:
          DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/metardu_e2e'
      - name: Apply database migrations
        run: npm run migrate
        env:
          DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/metardu_e2e'
      - name: Seed E2E test user
        run: node scripts/seed-e2e-user.mjs
        env:
          DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/metardu_e2e'
      # E2E_SEED_GUARD (2026-08-12): fail fast if the seeded users row is
      # missing before the shards run. The shard-2/4 hang (30-min job timeout,
      # "invalid input syntax for type uuid: \"\"") came from the seed not
      # landing; a silent seed regression (removed step, schema drift, id
      # mismatch) would re-introduce it. The script's --verify mode SELECTs the
      # row and exits non-zero on absence.
      - name: Assert E2E seed user row exists
        run: node scripts/seed-e2e-user.mjs --verify
        env:
          DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/metardu_e2e'
      # Dev server handles middleware correctly; the standalone server had
      # edge-sandbox crashes with middleware. The build artifact is not needed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests (group ${{ matrix.shard }}/4)
        env:
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
          CI_E2E_PROD: 'false'
          # Postgres service container is running at 127.0.0.1:5432 with
          # user ci / password ci / db metardu_e2e (see `services:` above).
          DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/metardu_e2e'
          AUTH_SECRET: 'e2e-ci-secret-not-used-by-mocked-auth'
          # OAuth creds must be non-empty: next-auth throws SIGNIN_OAUTH_ERROR
          # "client_id is required" when a provider's clientId is '' (the login
          # page renders hardcoded Google/Microsoft buttons that POST to
          # /api/auth/signin/<provider>). Dummies keep the OAuth signin route
          # healthy; the specs never complete a real OAuth flow.
          GOOGLE_CLIENT_ID: 'e2e-google-client-id'
          GOOGLE_CLIENT_SECRET: 'e2e-google-client-secret'
          AZURE_AD_CLIENT_ID: 'e2e-azure-client-id'
          AZURE_AD_CLIENT_SECRET: 'e2e-azure-client-secret'
        run: npx playwright test --reporter=list --workers=${{ matrix.workers }} ${{ matrix.specs }}
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e-report:
    # Synthetic status check — branch protection should require THIS job, not
    # individual e2e shards (whose names change with matrix.shard counts).
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - name: Report overall E2E status
        run: |
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "✓ All E2E shards passed"
          else
            echo "✗ One or more E2E shards failed (result: ${{ needs.e2e.result }})"
            exit 1
          fi

  mobile-build-check:
    name: Mobile Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # AUDIT FIX (2026-08-03): The static export can only contain pages that
      # are renderable without a server. API routes, dynamic web routes and
      # server-backed pages (searchParams/cookies/db at render time) cannot be
      # statically exported — they are stashed by scripts/mobile-build.mjs
      # (same pattern as the existing api-stash) and restored afterwards.
      - name: Build static export (MOBILE_BUILD=true)
        run: node scripts/mobile-build.mjs
      - name: Verify static export exists
        run: |
          test -d out && echo "✓ static export OK"
          test -f out/index.html && echo "✓ index.html present"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # AUDIT FIX (C10, 2026-07-02): Removed `|| true` — critical
      # vulnerabilities now block the build. Use `--omit=dev` to audit
      # only production deps (matches `--production` semantics).
      - run: npm audit --audit-level=critical --omit=dev

  axe-sweep:
    # A11Y GATE (2026-08-04): axe-core WCAG sweep across every /tools/* page.
    # Blocks on ANY axe violation (--fail-on minor) and on any route that
    # fails to hydrate/scan — a hard regression gate, not a ratchet. The
    # sweep's own anti-flakiness re-scan suppresses transient violations.
    #
    # Bootstrap: the scan needs a headless Next.js dev server (AXE_SCAN_PORT,
    # default 3100) plus a browser. channel:'chrome' is tried first; the
    # bundled Playwright chromium (installed below) is the fallback.
    #
    # Protected routes (/fieldbook, /admin*) are EXCLUDED here: they need a
    # seeded Postgres + login, which this job does not provision — including
    # them would make them auth-failed and fail the gate every run. Wire a
    # DB-backed job for them if/when a service container is added.
    name: Axe-core WCAG Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Start Next.js dev server (headless)
        env:
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: |
          # nohup+disown: the server must survive the step shell exiting,
          # or the later scan step sees no listener. Teardown uses pkill on
          # the real `next` process (killing the npx wrapper PID alone would
          # orphan the server).
          # Supervised boot: the wrapper restarts `next dev` if it dies
          # mid-sweep (OOM / runner hiccup), so the sweep's recovery wait
          # (axe-gnss-scan.mjs) finds the server back instead of failing.
          nohup bash -c 'while true; do npx next dev -p 3100; sleep 3; done' > /tmp/axe-dev.log 2>&1 &
          disown || true
          echo $! > /tmp/axe-dev.pid
          # -m 20 caps a hung first compile so the poll can't burn the job budget.
          for i in $(seq 1 60); do
            if curl -sf -m 20 http://localhost:3100/tools > /dev/null 2>&1; then
              echo "dev server ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start:"
          cat /tmp/axe-dev.log
          exit 1
      - name: Run axe-core WCAG sweep (blocking — fails on any violation)
        env:
          AXE_SCAN_PORT: '3100'
        run: node scripts/axe-gnss-scan.mjs --ci --fail-on minor --no-baseline --exclude fieldbook,admin,survey-report-builder,portfolio,progress-monitor,regulatory-checklist --concurrency 6
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-sweep-report
          path: axe-sweep-report.md
          retention-days: 7
      - name: Stop dev server
        if: always()
        run: |
          kill $(cat /tmp/axe-dev.pid) 2>/dev/null || true
          pkill -f 'next dev -p 3100' 2>/dev/null || true
