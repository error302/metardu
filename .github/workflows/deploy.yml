name: Deploy to Production

# Production deploys run AUTOMATICALLY on every push to main (owner decision,
# 2026-08-30). History: push-to-main auto-deploy has been the standing
# behaviour for weeks (see the workflow's run history); it was switched to
# manual dispatch-only for a few hours during the 2026-08-29 audit
# remediation (H-14) and restored to automatic the same day per owner
# preference. Note: an earlier comment here claimed the push trigger had
# been "silently dead due to a branches typo" — that was a misdiagnosis of
# a terminal display artifact ("main" shown as "ain" + "]"); the trigger
# was never broken.
#
# Security posture (audit H-14, rebalanced per owner preference for automatic
# deploys):
#   - No credentials in the repo: SSH uses the VM_SSH_KEY secret
#   - The VM host key is PINNED via the VM_KNOWN_HOSTS secret →
#     StrictHostKeyChecking=yes (MITM-proof channel to production)
#   - A pre-deploy database backup is taken on the VM before any change
#   - Required env vars are verified BEFORE the build (fail fast, clear msg)
#   - Post-deploy container health + HTTP verification gates every run
#   - Rollback path: rollback.yml (with the SHA recorded by promote.yml)
#
# Recommended hardening (not enforced today): branch protection with required
# reviews on main, so pushes are reviewed before they auto-deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VM via Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # SECURITY (audit H-14): the VM host key is pinned from the
      # VM_KNOWN_HOSTS secret (`ssh-keyscan -H <host>` output). Without the
      # secret we fall back to a best-effort keyscan with a loud warning so
      # deploys keep working while the secret is being (re-)added.
      - name: Pin VM host key (VM_KNOWN_HOSTS secret) or best-effort keyscan
        run: |
          if [ -n "${{ secrets.VM_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
            echo "Host key pinned from VM_KNOWN_HOSTS secret — StrictHostKeyChecking enabled."
            echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
          else
            ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
              echo "::warning::VM_KNOWN_HOSTS not set and ssh-keyscan failed; deploy continues with StrictHostKeyChecking=no. Add the VM_KNOWN_HOSTS secret to pin the host key (audit H-14)."
            echo "SSH_STRICT=no" >> "$GITHUB_ENV"
          fi

      # Pre-flight + safety net BEFORE the rebuild:
      #   1. Fail fast (clear message) if any env var the app hard-requires
      #      is missing from ~/metardu/.env — docker compose would otherwise
      #      fail mid-deploy with a cryptic error (or worse, ship a config
      #      that silently breaks payments/cron).
      #   2. Take a pre-deploy database backup so any bad migration or data
      #      change can be rolled back (same guarantee promote.yml gives).
      - name: "Pre-flight: verify required env vars and back up the database"
        run: |
          ssh -o StrictHostKeyChecking=$SSH_STRICT -o ConnectTimeout=15 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'PREFLIGHT'
          set -eo pipefail
          cd "$HOME/metardu"

          echo "=== [1/2] Verifying required env vars in .env ==="
          MISSING=0
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD AUTH_SECRET WORKER_SECRET API_ADMIN_KEY PAYPAL_WEBHOOK_ID; do
            if grep -qE "^${v}=.+" .env 2>/dev/null; then
              echo "  $v: ok"
            else
              echo "  $v: MISSING — deploy aborted."
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "FATAL: required env vars missing in ~/metardu/.env."
            echo "APP_DB_PASSWORD must be a separate random secret from POSTGRES_PASSWORD."
            echo "PAYPAL_WEBHOOK_ID: the webhook handler rejects ALL PayPal events"
            echo "without it (audit H-03 fail-closed). API_ADMIN_KEY: cron + metrics"
            echo "auth (audit H-13). Add the missing vars to the VM .env and re-run."
            exit 1
          fi

          echo "=== [2/2] Pre-deploy database backup ==="
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="$HOME/metardu-backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/pre_deploy_${TIMESTAMP}.sql.gz"
          # Use the postgres container's OWN env (set by compose at init) —
          # avoids host-side .env parsing/quote issues entirely.
          if docker exec metardu-postgres sh -c 'pg_dump -U "${POSTGRES_USER:-postgres}" "${POSTGRES_DB:-$POSTGRES_USER}"' | gzip > "$BACKUP_FILE"; then
            SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000 ]; then
              echo "Backup saved: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1), $SIZE bytes)"
            else
              echo "FATAL: backup file suspiciously small ($SIZE bytes) — likely a failed dump. Aborting."
              rm -f "$BACKUP_FILE"
              exit 1
            fi
          else
            echo "FATAL: pre-deploy database backup failed — aborting so we never deploy without a rollback point."
            rm -f "$BACKUP_FILE"
            exit 1
          fi
          PREFLIGHT

      - name: Pull latest code and rebuild Docker
        run: |
          ssh -o StrictHostKeyChecking=$SSH_STRICT -o ConnectTimeout=15 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'DEPLOY'
          set -eo pipefail

          APP_DIR="$HOME/metardu"
          EXPECTED_DEPLOY_SHA='${{ github.sha }}'
          cd "$APP_DIR"

          echo "=== [1/6] Pulling latest code ==="
          git fetch origin main
          REMOTE_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$REMOTE_MAIN_SHA" != "$EXPECTED_DEPLOY_SHA" ]; then
            echo "FATAL: this deploy was triggered for $EXPECTED_DEPLOY_SHA, but origin/main is now $REMOTE_MAIN_SHA. A newer queued deploy must run; refusing to deploy a different revision."
            exit 1
          fi
          git reset --hard "$EXPECTED_DEPLOY_SHA"
          export METARDU_BUILD_SHA="$EXPECTED_DEPLOY_SHA"
          echo "Deploying commit $METARDU_BUILD_SHA"

          echo "=== [2/6] Database credential separation ==="
          echo "Compose provisions APP_DB_USER for web traffic; the bootstrap login is limited to migration and backup services."

          echo "=== [3/6] Rebuilding Docker containers (incremental) ==="
          # Use --build instead of --no-cache to leverage Docker layer cache
          # Only changed layers are rebuilt — typically just the COPY + npm run build
          docker compose up -d --build 2>&1

          # AUDIT FIX (2026-07-05): Container name was metardu_nextjs but
          # docker-compose.yml defines it as metardu-app. The old name caused
          # `docker inspect` to always return "not_found", making the health
          # loop waste 180s and then silently fall through to the curl check.
          # Also: the warning at iteration 36 was not failing the deploy.
          # Now: we exit 1 if the container is not healthy, surfacing real
          # failures (failed migrations, port conflicts, OOM, etc.) instead
          # of letting curl be the only gate.
          CONTAINER_NAME="metardu-app"

          echo "=== [4/6] Waiting for container '$CONTAINER_NAME' to be healthy ==="
          HEALTHY=false
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy after $((i * 5)) seconds"
              HEALTHY=true
              break
            fi
            echo "  Waiting... ($((i * 5))s) status=$STATUS"
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Container '$CONTAINER_NAME' not healthy after 180s"
            echo "--- Last 50 log lines ---"
            docker logs --tail 50 "$CONTAINER_NAME" 2>&1 || echo "(could not fetch logs)"
            echo "--- Container state ---"
            docker ps -a --filter "name=$CONTAINER_NAME" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            exit 1
          fi

          echo "=== [5/6] Verifying database schema state (migrations gate) ==="
          # The one-shot metardu-db-migrate dependency applies migrations as
          # the bootstrap login. The app entrypoint and this deploy gate both
          # verify schema history with the restricted runtime login.
          if docker exec metardu-app node /app/verify-migrations.mjs; then
            echo "Schema verified: all migrations applied, checksums match."
          else
            echo "FATAL: database schema does not match the migrations directory."
            echo "--- One-shot migration service log ---"
            docker logs --tail 80 metardu-db-migrate 2>&1 || echo "(could not fetch logs)"
            echo "--- Application startup log ---"
            docker logs --tail 30 metardu-app 2>&1 || echo "(could not fetch logs)"
            exit 1
          fi

          echo "=== [6/6] Verifying deployment via HTTP ==="
          ACTUAL_DEPLOY_SHA=$(docker exec metardu-app node -e 'fetch("http://127.0.0.1:3000/api/public/health").then(async r=>{if(!r.ok)throw new Error(`health status ${r.status}`);return r.json()}).then(body=>process.stdout.write(body.releaseId ?? "")).catch(()=>process.exit(1))')
          echo "Application release: $ACTUAL_DEPLOY_SHA"
          if [ "$ACTUAL_DEPLOY_SHA" = "$EXPECTED_DEPLOY_SHA" ]; then
            echo "Application health and release identity verified."
          else
            echo "FATAL: expected release $EXPECTED_DEPLOY_SHA, received $ACTUAL_DEPLOY_SHA"
            docker logs --tail 50 "$CONTAINER_NAME" 2>&1 || echo "(could not fetch logs)"
            exit 1
          fi
          DEPLOY

      - name: Verify live deployment
        if: success()
        run: |
          EXPECTED_DEPLOY_SHA='${{ github.sha }}'
          HEALTH_URL="https://metardu.space/api/public/health"
          HEALTH_JSON=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 5 --max-time 20 "$HEALTH_URL")
          ACTUAL_DEPLOY_SHA=$(jq -r '.releaseId // empty' <<< "$HEALTH_JSON")
          echo "Live release: $ACTUAL_DEPLOY_SHA"
          if [ "$ACTUAL_DEPLOY_SHA" != "$EXPECTED_DEPLOY_SHA" ]; then
            echo "FATAL: live endpoint did not serve expected commit $EXPECTED_DEPLOY_SHA"
            exit 1
          fi
          echo "Live release identity verified."
