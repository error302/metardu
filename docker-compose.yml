# AUDIT FIX (H8, 2026-07-02):
#   Previously hardcoded credentials were committed to version control:
#     POSTGRES_PASSWORD=metardu_secure_2024
#     AUTH_SECRET=dev-auth-secret-32-chars-long-or-more-needed-for-nextauth
#     WORKER_SECRET=dev-worker-secret
#   These are now read from a .env file (gitignored). Copy .env.example
#   to .env and fill in strong random values before running:
#     cp .env.example .env
#     # Edit .env — generate secrets with: openssl rand -base64 32
#     docker compose up -d
#
#   IMPORTANT: If you previously deployed with the old hardcoded values,
#   you MUST rotate them:
#     1. Generate new secrets (see .env.example for commands)
#     2. Update .env on the production server
#     3. Restart all services: docker compose down && docker compose up -d
#     4. The POSTGRES_PASSWORD change requires recreating the postgres
#        volume OR running ALTER USER to change the password in-place.

services:
  metardu-postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: metardu-postgres
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-metardu}
      - POSTGRES_USER=${POSTGRES_USER:-metardu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metardu} -d ${POSTGRES_DB:-metardu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  # Database administration is isolated to this short-lived service. The web
  # container connects through the restricted APP_DB_* credentials below.
  metardu-db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://metardu.space}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    container_name: metardu-db-migrate
    entrypoint: ["node"]
    command: ["/app/provision-runtime-db-role.mjs"]
    environment:
      - MIGRATION_DB_HOST=metardu-postgres
      - MIGRATION_DB_PORT=5432
      - MIGRATION_DB_NAME=${POSTGRES_DB:-metardu}
      - MIGRATION_DB_USER=${POSTGRES_USER:-metardu}
      - MIGRATION_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - APP_DB_HOST=metardu-postgres
      - APP_DB_PORT=5432
      - APP_DB_NAME=${POSTGRES_DB:-metardu}
      - APP_DB_USER=${APP_DB_USER:-metardu_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
      - NODE_ENV=production
    depends_on:
      metardu-postgres:
        condition: service_healthy
    restart: "no"

  # Redis for caching, rate limiting, session store, and real-time pub/sub.
  metardu-redis:
    image: redis:7-alpine
    container_name: metardu-redis
    expose:
      - "6379"
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  metardu-worker:
    build:
      context: ./python_worker
    container_name: metardu-worker
    # No host port mapping — only accessible within Docker network
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  metardu-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://metardu.space}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    container_name: metardu-app
    # SECURITY (audit C-05, 2026-08-30): bound to loopback only. Publishing
    # 3000 on 0.0.0.0 let anyone reach the app origin directly, bypassing the
    # reverse proxy (and its X-Forwarded-For handling) entirely. The proxy
    # reaches the app either over the Docker network or via 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    # AUDIT FIX (H-15, 2026-08-30): uploaded files (STORAGE_ROOT, default
    # /app/upload) previously lived on the container filesystem and were
    # DESTROYED on every rebuild (`docker compose up -d --build`). They now
    # live on a named volume that the backup sidecar also mounts.
    volumes:
      - uploads_data:/app/upload
    environment:
      - DB_HOST=metardu-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-metardu}
      - DB_USER=${APP_DB_USER:-metardu_app}
      - DB_PASSWORD=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
      - METARDU_BUILD_SHA=${METARDU_BUILD_SHA:-unknown}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - METARDU_MCP_ENABLED=${METARDU_MCP_ENABLED:-false}
      - METARDU_MCP_ORIGIN=${METARDU_MCP_ORIGIN:-https://metardu.space}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001/ws/collaboration}
      - PYTHON_COMPUTE_URL=http://metardu-worker:8000
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set in .env}
      - REDIS_URL=redis://metardu-redis:6379
      - HOSTNAME=0.0.0.0
      - DISABLE_PWA=${DISABLE_PWA:-false}
      - NODE_ENV=production
      # PayPal recurring subscriptions (server-side; hydrated from .env)
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_PLAN_PRO_USD=${PAYPAL_PLAN_PRO_USD:-}
      - PAYPAL_PLAN_PRO_EUR=${PAYPAL_PLAN_PRO_EUR:-}
      - PAYPAL_PLAN_PRO_GBP=${PAYPAL_PLAN_PRO_GBP:-}
      - PAYPAL_PLAN_PRO_AUD=${PAYPAL_PLAN_PRO_AUD:-}
      - PAYPAL_PLAN_TEAM_USD=${PAYPAL_PLAN_TEAM_USD:-}
      - PAYPAL_PLAN_TEAM_EUR=${PAYPAL_PLAN_TEAM_EUR:-}
      - PAYPAL_PLAN_TEAM_GBP=${PAYPAL_PLAN_TEAM_GBP:-}
      - PAYPAL_PLAN_TEAM_AUD=${PAYPAL_PLAN_TEAM_AUD:-}
      - PAYPAL_PLAN_FIRM_USD=${PAYPAL_PLAN_FIRM_USD:-}
      - PAYPAL_PLAN_FIRM_EUR=${PAYPAL_PLAN_FIRM_EUR:-}
      - PAYPAL_PLAN_FIRM_GBP=${PAYPAL_PLAN_FIRM_GBP:-}
      - PAYPAL_PLAN_FIRM_AUD=${PAYPAL_PLAN_FIRM_AUD:-}
      - PAYPAL_PLAN_PRO=${PAYPAL_PLAN_PRO:-}
      - PAYPAL_PLAN_TEAM=${PAYPAL_PLAN_TEAM:-}
      - PAYPAL_PLAN_FIRM=${PAYPAL_PLAN_FIRM:-}
      - PAYPAL_PLAN_ENTERPRISE=${PAYPAL_PLAN_ENTERPRISE:-}
      # Admin identity — REQUIRED for platform-owner/admin recognition at login.
      # Without these the login role computation never yields super_admin.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - PLATFORM_OWNER_EMAIL=${PLATFORM_OWNER_EMAIL:-}
      # Cron job auth (trial reminders, M-Pesa reconciliation)
      - API_ADMIN_KEY=${API_ADMIN_KEY:-}
      # Branded transactional email (welcome, verification, password reset,
      # receipts). Support both SMTP_PASS and SMTP_PASSWORD in deployments.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # NVIDIA NIM AI (Survey Assistant, report generation, field-photo OCR)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      # OAuth sign-in providers (NextAuth enables each only when both ID and Secret are set)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
    depends_on:
      metardu-postgres:
        condition: service_healthy
      metardu-db-migrate:
        condition: service_completed_successfully
      metardu-worker:
        condition: service_healthy
      metardu-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  metardu-collaboration:
    build:
      context: .
      dockerfile: Dockerfile.collaboration
    container_name: metardu-collaboration
    # CMD is defined in Dockerfile.collaboration as ["node", "collabEntry.js"]
    # Do NOT override command here — the compiled entrypoint handles everything.
    expose:
      - "3001"
    environment:
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://metardu-redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      metardu-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: on-failure:5

  # AUDIT FIX (H7, 2026-07-02): Backup sidecar runs backup.sh daily.
  # Backups are written to the `backups` volume (mount to host for
  # offsite copy). Configure via env vars:
  #   BACKUP_CRON="0 2 * * *"        (cron schedule, default daily 02:00 UTC)
  #   BACKUP_RETENTION=30            (days to keep backups)
  #   GPG_RECIPI=admin@metardu.org   (optional: encrypt backups with GPG)
  #   BACKUP_OFFSITE_DIR=/offsite    (optional: copy to secondary location)
  metardu-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: metardu-backup
    environment:
      - PGHOST=metardu-postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-metardu}
      - PGUSER=${POSTGRES_USER:-metardu}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - BACKUP_DIR=/backups
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-30}
      - GPG_RECIPI=${GPG_RECIPI:-}
      - BACKUP_OFFSITE_DIR=${BACKUP_OFFSITE_DIR:-}
      - BACKUP_LOG_FILE=/var/log/backup.log
    volumes:
      - backups:/backups
      # AUDIT FIX (H-15, 2026-08-30): the "offsite" host mount was READ-ONLY,
      # so the offsite copy path could never write to it. It is now writable.
      # Mount a real offsite destination (or use rclone in backup.sh).
      - ./backups:/host-backups
      # AUDIT FIX (H-15, 2026-08-30): uploads were never backed up — mount
      # the shared uploads volume so backup.sh can archive it.
      - uploads_data:/uploads:ro
    depends_on:
      metardu-postgres:
        condition: service_healthy
    restart: unless-stopped

  # P0-6 (2026-07-24): NTRIP WebSocket Proxy.
  # Browsers cannot open raw TCP sockets to NTRIP casters (RTCM
  # correction streams for GNSS rovers), so this WebSocket-to-TCP
  # bridge is required for any in-browser RTK workflow.
  #
  # The proxy listens on port 8090 (ws://host:8090/ntrip). The Next.js
  # app's NTRIPClientPanel connects here. Configure the caster
  # allowlist via NTRIP_ALLOWED_HOSTS (comma-separated). If unset,
  # all hosts are allowed (useful for dev; restrict in production).
  #
  # Health check: GET http://host:8090/health → { status, connections, allowedHosts }
  metardu-ntrip:
    build:
      context: .
      dockerfile: Dockerfile.ntrip
    container_name: metardu-ntrip
    # SECURITY (audit H-11, 2026-08-30): bound to loopback — the NTRIP proxy
    # must not be an open relay reachable from the internet. Browsers reach
    # it through the reverse proxy's /ntrip/* path, never the raw port.
    ports:
      - "127.0.0.1:${NTRIP_PORT:-8090}:8090"
    environment:
      - PORT=8090
      - ALLOWED_HOSTS=${NTRIP_ALLOWED_HOSTS:-}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backups:
  uploads_data:
